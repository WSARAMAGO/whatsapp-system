<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Painel WhatsApp</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Painel WhatsApp</h1>
  <div id="qr-code">
    <iframe src="/qr" width="220" height="220"></iframe>
  </div>

  <h2>Mensagens fixas</h2>
  <form method="POST" action="/mensagens">
    <textarea name="mensagens" rows="10" cols="50" placeholder="Digite suas mensagens, uma por linha"></textarea>
    <button type="submit">Salvar mensagens</button>
  </form>

  <h2>Upload de contatos</h2>
  <form method="POST" action="/upload" enctype="multipart/form-data">
    <input type="file" name="arquivo" accept=".csv">
    <button type="submit">Enviar contatos</button>
  </form>

  <h2>Controle</h2>
  <button onclick="iniciar()">Iniciar envio</button>
  <button onclick="parar()">Parar envio</button>

  <h2>Status</h2>
  <div id="status"></div>

  <script src="script.js"></script>
</body>
</html>
